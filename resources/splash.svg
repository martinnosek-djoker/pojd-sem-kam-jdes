<svg viewBox="0 0 2732 2732" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="2732" height="2732" fill="#000000"/>

  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo - centered and scaled -->
  <g transform="translate(866, 866)">
    <!-- Background circle -->
    <circle cx="500" cy="500" r="480" fill="url(#gradient)" opacity="0.2"/>

    <!-- Left arrow - "Pojď sem!" (Come here) -->
    <g>
      <path
        d="M 250 350 L 400 500 L 250 650"
        stroke="url(#arrowGradient)"
        stroke-width="60"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <line
        x1="400"
        y1="500"
        x2="150"
        y2="500"
        stroke="url(#arrowGradient)"
        stroke-width="50"
        stroke-linecap="round"
      />
    </g>

    <!-- Right arrow - "Kam jdeš?" (Where are you going?) -->
    <g>
      <path
        d="M 750 350 L 600 500 L 750 650"
        stroke="url(#arrowGradient)"
        stroke-width="60"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
      />
      <line
        x1="600"
        y1="500"
        x2="850"
        y2="500"
        stroke="url(#arrowGradient)"
        stroke-width="50"
        stroke-linecap="round"
      />
    </g>

    <!-- Central dot - meeting point -->
    <circle cx="500" cy="500" r="60" fill="#c084fc"/>
  </g>
</svg>
