<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1024px;
            height: 500px;
            background: linear-gradient(135deg, #1a0033 0%, #000000 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Purple glow effect */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            top: 50%;
            left: 20%;
            transform: translate(-50%, -50%);
        }

        .glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(147, 51, 234, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(50px);
            top: 30%;
            right: 15%;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .icon {
            font-size: 120px;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6));
        }

        .text-content {
            text-align: left;
        }

        h1 {
            font-size: 72px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #a855f7 0%, #d8b4fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .tagline {
            font-size: 28px;
            color: #c4b5fd;
            margin: 10px 0 0 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* Decorative elements */
        .corner-accent {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid rgba(168, 85, 247, 0.3);
        }

        .corner-top-left {
            top: 20px;
            left: 20px;
            border-right: none;
            border-bottom: none;
        }

        .corner-bottom-right {
            bottom: 20px;
            right: 20px;
            border-left: none;
            border-top: none;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="glow-2"></div>
    <div class="corner-accent corner-top-left"></div>
    <div class="corner-accent corner-bottom-right"></div>

    <div class="content">
        <div class="icon">☕</div>
        <div class="text-content">
            <h1>Pojďsemkamjdes</h1>
            <div class="tagline">Nejlepší kavárny a pekárny</div>
        </div>
    </div>
</body>
</html>
